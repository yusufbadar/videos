<!doctype html><meta charset="utf-8">
<!-- v05: UGC tip. The base video is her talking clip (jump-cut, 1080x1920) with
     black at the end. This layer is the hook, the word-timed captions, the
     cutaway to the real product (image sequences listed in data.json, kept out
     of the repo), her face in a circle while the cutaway runs, and the end card.
     data.json: { duration, end, cut:{in,boot,run,out}, seq, counts, words } -->
<link rel="stylesheet" href="../../lib/brand.css">
<style>
  #cut { position:absolute; inset:0; background:var(--void); opacity:0; z-index:10; overflow:hidden; }
  .view { position:absolute; inset:0; opacity:0; overflow:hidden; }
  .view img.shot { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; }
  /* Everything under the part of the page we are pointing at fades to the
     page colour, so the address bar, the captions and her face sit on a calm
     field. --p is where the fade starts. */
  .floor { position:absolute; left:0; right:0; top:var(--p); bottom:0; z-index:3;
    background:linear-gradient(to bottom, rgba(24,26,31,0) 0, #181a1f 70px, #121317 100%); }
  .lid { position:absolute; left:0; right:0; top:0; height:110px; background:#22242a; z-index:3; }
  .pip { position:absolute; left:64px; top:1206px; width:232px; height:232px; border-radius:50%; overflow:hidden; z-index:6;
    box-shadow:0 0 0 5px var(--fg), 0 18px 50px rgba(2,2,3,.6); }
  .pip img { width:100%; height:100%; display:block; }
  #cut .urlbar { z-index:5; }
  .urlbar .rest { color:var(--slate); }
  .urlbar b { margin-right:2px; }
</style>
<div id="stage">
  <div id="cut">
    <div class="view" id="vA"><img class="shot" id="seqA"><div class="floor" style="--p:690px"></div></div>
    <div class="view" id="vBoot"><img class="shot" id="seqBoot"><div class="floor" style="--p:1010px"></div></div>
    <div class="view" id="vRun"><div id="runWrap" style="position:absolute;inset:0;transform-origin:50% 30%"><img class="shot" id="imgRun"><div class="lid"></div></div><div class="floor" style="--p:930px"></div></div>
    <div class="pip"><img id="seqPip"></div>
  </div>
</div>
<script type="module">
import { gsap, run, captions } from '../../lib/stage.js';
import { hook, urlTrick, endcard } from '../../lib/parts.js';
const D = window.DATA, C = D.cut;
const tl = gsap.timeline({ paused: true });

// Footage as image sequences (the renderer's Chromium has no H.264).
const seq = (id, dir, start, count) => {
  const n = document.getElementById(id);
  n.dataset.seq = `${D.seq}/${dir}/f_%04d.jpg`; n.dataset.fps = 30; n.dataset.start = start; n.dataset.count = count;
  n.src = `${D.seq}/${dir}/f_0001.jpg`;
};
seq('seqA', 'a', C.in, D.counts.a);
seq('seqBoot', 'boot', C.boot, D.counts.boot);
seq('seqPip', 'pip', C.in, D.counts.pip);
document.getElementById('imgRun').src = `${D.seq}/run/run.jpg`;

// Hook: on frame one, under her chin. It carries the first spoken words, so
// the captions start with the next ones.
hook(tl, 'Stop cloning GitHub repos.', { y: 900, size: 84, out: C.in - 0.16 });

// Cutaway A: the link goes into the box on pyrovue.com, and the trick is typed
// in the address bar underneath it.
tl.set('#cut', { opacity: 1 }, C.in).set('#vA', { opacity: 1 }, C.in)
  .fromTo('#seqA', { scale: 1.035, x: -19, y: -20 }, { scale: 1, x: 0, y: 0, duration: 0.5, ease: 'pv' }, C.in)
  .from('.pip', { scale: 0.6, opacity: 0, duration: 0.3, ease: 'pvPop' }, C.in + 0.04);
const bar = urlTrick(tl, C.in + 0.46, { repo: 'github.com/drawdb-io/drawdb', y: 742, size: 44, cps: 8.4, parent: document.getElementById('vA') });
tl.from(bar, { y: 40, opacity: 0, duration: 0.28, ease: 'pv' }, C.in + 0.06)
  .to(bar.querySelector('.rest'), { color: '#181a1f', duration: 0.2, ease: 'none' }, C.in + 0.46)
  // "in front of the link": the prefix gets one small push.
  .fromTo(bar.querySelector('.pre'), { scale: 1 }, { scale: 1.09, duration: 0.14, ease: 'pv', yoyo: true, repeat: 1, transformOrigin: '50% 50%' }, 4.3)
  .to('#seqA', { scale: 1.02, x: -11, y: -9, duration: C.boot - 4.2, ease: 'none' }, 4.2);
bar.querySelector('.pre').style.display = 'inline-block';

// Cutaway B: the box boots (a time-lapse of the real setup steps), then the app
// is up on "runs".
tl.set('#vA', { opacity: 0 }, C.boot).set('#vBoot', { opacity: 1 }, C.boot)
  .fromTo('#seqBoot', { scale: 1.3, x: -162, y: -727 }, { scale: 1.36, x: -194, y: -774, duration: C.run - C.boot, ease: 'none' }, C.boot)
  .set('#vBoot', { opacity: 0 }, C.run).set('#vRun', { opacity: 1 }, C.run)
  .fromTo('#runWrap', { scale: 1.07 }, { scale: 1, duration: 0.4, ease: 'pv' }, C.run)
  .to('#runWrap', { scale: 1.015, duration: C.out - C.run - 0.4, ease: 'none' }, C.run + 0.4)
  .set('#cut', { opacity: 0 }, C.out);

// Captions: the spoken words, two at a time, below her mouth and above the circle.
captions(D.words.filter((w) => w.start > 0.9), { maxWords: 2, maxChars: 16, y: 1104, size: 84, emphasis: ['pyrovuecom', 'runs'] });

endcard(tl, D.end, { hold: D.duration - D.end });
run(tl, D.duration);
</script>
